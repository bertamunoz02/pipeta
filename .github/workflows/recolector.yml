name: Recolector de contenido

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, en el minuto 17
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths:
      - "fuentes.json"
      - "recolector/**"
      - ".github/workflows/recolector.yml"

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar el modelo del clasificador (para no descargarlo cada hora)
        uses: actions/cache@v4
        with:
          path: recolector/.modelo
          key: modelo-minilm-multilingue-v1

      - name: Instalar dependencias
        run: pip install -r recolector/requirements.txt

      - name: Recoger contenido de las fuentes
        run: python recolector/recolector.py

      - name: Guardar el resultado
        run: |
          git config user.name "pipeta-recolector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar contenido del feed"
            git pull --rebase origin main
            git push
          fi
