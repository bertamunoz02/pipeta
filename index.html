<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pipeta</title>
<meta name="description" content="Scroll infinito de ciencia: artículos recientes de PubMed y preprints, por temas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una pantalla = un artículo; barra de temas arriba, feed con snap vertical, acciones a la derecha como en TikTok */
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#15171c; --muted:#5d6370; --line:#dfe2e8;
  --accent:#3b45d6; --accent-ink:#ffffff; --chip:#e8eaf3;
  --gen:#c2410c; --neu:#7c3aed; --eco:#15803d; --mic:#0e7490; --evo:#a16207; --bio:#be123c; --bot:#4d7c0f; --mar:#1d4ed8;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0f14; --card:#161922; --ink:#eceef3; --muted:#9aa1b0; --line:#262a36;
  --accent:#8f97ff; --accent-ink:#0d0f14; --chip:#1f2330;
  --gen:#fb923c; --neu:#a78bfa; --eco:#4ade80; --mic:#22d3ee; --evo:#facc15; --bio:#fb7185; --bot:#a3e635; --mar:#60a5fa;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d0f14; --card:#161922; --ink:#eceef3; --muted:#9aa1b0; --line:#262a36;
  --accent:#8f97ff; --accent-ink:#0d0f14; --chip:#1f2330;
  --gen:#fb923c; --neu:#a78bfa; --eco:#4ade80; --mic:#22d3ee; --evo:#facc15; --bio:#fb7185; --bot:#a3e635; --mar:#60a5fa;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{flex:none;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);background:var(--bg)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo svg{width:22px;height:22px}
.views{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:999px}
.views button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--f-mono);font-size:.75rem}
.views button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;
  font-family:var(--f-mono);font-size:.78rem;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{position:relative;width:100%;max-width:680px;height:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;
  display:grid;grid-template-columns:minmax(0,1fr) auto;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c,var(--accent))}
.content{min-width:0;display:flex;flex-direction:column;gap:12px;padding:26px 8px 20px 24px;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tag{color:var(--c,var(--accent));font-weight:500}
.badge{border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.badge.pre{border-color:var(--evo);color:var(--evo)}
.badge.oa{border-color:var(--eco);color:var(--eco)}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.9rem);line-height:1.12;letter-spacing:-.015em;margin:0;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.authors{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin:0}
.abstract{flex:1;min-height:0;overflow-y:auto;font-size:1.02rem;line-height:1.6;margin:0;padding-right:8px;max-width:65ch;
  mask-image:linear-gradient(#000 80%,transparent);-webkit-mask-image:linear-gradient(#000 80%,transparent)}
.abstract.open{mask-image:none;-webkit-mask-image:none}
.journal{font-family:var(--f-body);font-style:italic;font-size:.9rem;color:var(--muted);margin:0}
.rail{display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:20px 14px 20px 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;cursor:pointer;
  font-family:var(--f-mono);font-size:.66rem;color:var(--muted);text-decoration:none}
.act span.ic{width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.act:hover span.ic{transform:scale(1.06)}
.act svg{width:21px;height:21px}
.act.on span.ic{background:var(--accent);color:var(--accent-ink)}
.act.primary span.ic{background:var(--ink);color:var(--bg)}

.state{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.state h3{font-family:var(--f-display);color:var(--ink);margin:0 0 6px;font-size:1.3rem}
.state button{margin-top:14px;border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;cursor:pointer;font-family:var(--f-mono)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-family:var(--f-mono);font-size:.8rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:480px){.content{padding:22px 4px 16px 18px}.rail{padding:16px 10px 16px 4px}.act span.ic{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}main{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 3l7 7M16.5 5.5L7 15l-2 5 5-2 9.5-9.5"/><path d="M9 13l2 2" stroke="var(--accent)"/></svg>
      Pipeta
    </div>
    <div class="views" role="group" aria-label="Vista">
      <button id="v-feed" aria-pressed="true">Para ti</button>
      <button id="v-saved" aria-pressed="false">Guardados</button>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Temas"></nav>
</header>
<main id="feed" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- Temas: nombre visible + términos de búsqueda en inglés (Europe PMC indexa en inglés) ----------
const TOPICS = [
  {id:"todo", name:"Todo", c:"var(--accent)", terms:[]},
  {id:"gen", name:"Genética", c:"var(--gen)", terms:["genetics","genomics","CRISPR","gene expression"]},
  {id:"neu", name:"Neurociencia", c:"var(--neu)", terms:["neuroscience","brain","neurons","cognition"]},
  {id:"eco", name:"Ecología", c:"var(--eco)", terms:["ecology","biodiversity","ecosystem","climate change"]},
  {id:"mic", name:"Microbiología", c:"var(--mic)", terms:["microbiome","bacteria","virus","antibiotic resistance"]},
  {id:"evo", name:"Evolución", c:"var(--evo)", terms:["evolution","phylogenetics","ancient DNA","speciation"]},
  {id:"bio", name:"Biomedicina", c:"var(--bio)", terms:["cancer","immunology","vaccine","drug discovery"]},
  {id:"bot", name:"Botánica", c:"var(--bot)", terms:["plant biology","photosynthesis","plant development"]},
  {id:"mar", name:"Biología marina", c:"var(--mar)", terms:["marine biology","coral reef","ocean","fisheries"]},
];
const API = "https://www.ebi.ac.uk/europepmc/webservices/rest/search";
const DAYS_BACK = 45;

// ---------- Estado ----------
let topic = TOPICS[0], cursor = "*", loading = false, done = false, view = "feed";
const seen = new Set();
let saved = load();
const feed = document.getElementById("feed");

function load(){ try{ return JSON.parse(localStorage.getItem("pipeta-saved")||"[]") }catch(e){ return [] } }
function persist(){ try{ localStorage.setItem("pipeta-saved", JSON.stringify(saved)) }catch(e){} }
function isSaved(id){ return saved.some(s=>s.id===id) }

// ---------- Construir la consulta ----------
function iso(d){ return d.toISOString().slice(0,10) }
function buildQuery(t, minimal){
  const terms = (t.id==="todo" ? TOPICS.slice(1).map(x=>x.terms[0]) : t.terms);
  const q = terms.map(w => w.includes(" ") ? `"${w}"` : w).join(" OR ");
  if(minimal) return `(${q})`;
  const to = new Date(), from = new Date(Date.now()-DAYS_BACK*864e5);
  return `(${q}) AND HAS_ABSTRACT:y AND (SRC:MED OR SRC:PPR) AND FIRST_PDATE:[${iso(from)} TO ${iso(to)}]`;
}
function topicOf(text){
  const low = text.toLowerCase();
  for(const t of TOPICS.slice(1)) if(t.terms.some(w=>low.includes(w.toLowerCase()))) return t;
  return TOPICS[0];
}
function clean(html){ const d=new DOMParser().parseFromString(html||"","text/html"); return (d.body.textContent||"").replace(/\s+/g," ").trim() }
function fmtDate(s){ if(!s) return ""; const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}) }
function authors(s){ if(!s) return ""; const a=s.replace(/\.$/,"").split(", "); return a.length>3 ? a.slice(0,3).join(", ")+" et al." : a.join(", ") }

function toItem(r){
  // doble limpieza: algunos títulos llegan con etiquetas codificadas (&lt;i&gt;…)
  const title = clean(clean(r.title)), abs = clean(clean(r.abstractText));
  const t = topic.id==="todo" ? topicOf(title+" "+abs) : topic;
  const pre = r.source==="PPR";
  const url = r.source && r.id ? `https://europepmc.org/article/${r.source}/${r.id}` : (r.doi?`https://doi.org/${r.doi}`:"");
  return {
    id: `${r.source}-${r.id}`, title, abs, url,
    authors: authors(r.authorString),
    journal: pre ? (r.bookOrReportDetails?.publisher || "Preprint") : (r.journalInfo?.journal?.title || r.journalTitle || ""),
    date: r.firstPublicationDate || r.pubYear || "",
    pre, oa: r.isOpenAccess==="Y", topic: t.id
  };
}

// ---------- Llamada a Europe PMC, con planes B por si la fuente rechaza algún parámetro ----------
let mode = 0; // 0: ordenado por fecha, 1: sin ordenar, 2: consulta mínima
function status(msg){ const s = feed.querySelector(".loader .msg"); if(s) s.textContent = msg }
async function query(){
  const errors = [];
  for(let m = mode; m < 3; m++){
    const params = {format:"json", resultType:"core", pageSize:"15", cursorMark:cursor, query: buildQuery(topic, m===2)};
    if(m===0) params.sort = "P_PDATE_D desc";
    status(`Conectando con Europe PMC… (intento ${m+1} de 3)`);
    const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 20000);
    try{
      const res = await fetch(`${API}?${new URLSearchParams(params)}`, {signal:ctrl.signal});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const data = await res.json();
      if(!data.resultList) throw new Error("respuesta sin resultados");
      mode = m; // recordamos la que funcionó
      return data;
    }catch(e){ errors.push(`intento ${m+1}: ${e.name==="AbortError" ? "tardó más de 20 s" : (e.message||e)}`) }
    finally{ clearTimeout(timer) }
  }
  throw new Error(errors.join(" · "));
}

// ---------- Pedir más artículos ----------
async function fetchMore(){
  if(loading||done||view!=="feed") return;
  loading = true; showLoader(true);
  try{
    let shown = 0;
    // hasta 4 páginas seguidas si los resultados no traen resumen útil
    for(let page = 0; page < 4 && !shown && !done; page++){
      const data = await query();
      const raw = data.resultList.result || [];
      const items = raw.map(toItem).filter(i=>i.title && i.abs.length>80 && !seen.has(i.id));
      status(`Recibidos ${raw.length} resultados, ${items.length} con resumen`);
      if(!data.nextCursorMark || data.nextCursorMark===cursor || !raw.length) done = true;
      cursor = data.nextCursorMark || cursor;
      const wasEmpty = !feed.querySelector(".slide:not(.loader)");
      items.forEach(i=>{ seen.add(i.id); feed.insertBefore(card(i), loaderEl()) });
      // el navegador se queda "enganchado" al cargador; en la primera carga volvemos al primer artículo
      if(wasEmpty && items.length){ feed.scrollTop = 0; requestAnimationFrame(()=>{ feed.scrollTop = 0 }) }
      shown = items.length;
    }
    if(!feed.querySelector(".slide:not(.loader)")) showState("Nada por aquí","La fuente respondió, pero no hay artículos recientes con resumen para este tema.", true);
    else if(done) loaderEl().remove();
  }catch(e){
    showLoader(false);
    if(!feed.querySelector(".slide:not(.loader)")) showState("Sin conexión con la fuente",
      "No se pudo conectar con Europe PMC. Si lo estás viendo dentro de la vista previa de Claude, descarga el archivo y ábrelo directamente en tu navegador. Detalle técnico: " + (e.message||e), true);
    else toast("No se pudieron cargar más artículos");
  }finally{ loading = false }
}

// ---------- Traducción al español con el traductor integrado de Chrome (gratis, funciona en tu ordenador) ----------
let translatorP = null;
async function translate(text){
  if(!("Translator" in self)) throw new Error("sin traductor integrado");
  if(!translatorP){
    translatorP = (async()=>{
      const av = await Translator.availability({sourceLanguage:"en", targetLanguage:"es"});
      if(av==="unavailable") throw new Error("idioma no disponible");
      if(av!=="available") toast("Descargando el traductor (solo la primera vez)…");
      return Translator.create({sourceLanguage:"en", targetLanguage:"es",
        monitor(m){ m.addEventListener("downloadprogress", e=>toast(`Descargando traductor… ${Math.round(e.loaded*100)}%`)) }});
    })();
    translatorP.catch(()=>{ translatorP = null });
  }
  const tr = await translatorP;
  // por frases en bloques, para resúmenes largos
  const parts = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
  const chunks = []; let cur = "";
  for(const p of parts){ if(cur && (cur+p).length > 900){ chunks.push(cur); cur = p } else cur += p }
  if(cur) chunks.push(cur);
  const out = [];
  for(const c of chunks) out.push(await tr.translate(c.trim()));
  return out.join(" ");
}

// ---------- Pintar ----------
const ICON = {
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  saved:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  lang:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c0 4-3 7-7 8"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'
};
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e }
function card(i){
  const t = TOPICS.find(x=>x.id===i.topic)||TOPICS[0];
  const s = el("section","slide"); s.style.setProperty("--c", t.c);
  const c = el("article","card"); s.append(c);
  const ct = el("div","content");
  const meta = el("div","meta");
  meta.append(el("span","tag", t.id==="todo"?"Ciencia":t.name), el("span",null,fmtDate(i.date)));
  if(i.pre) meta.append(el("span","badge pre","Preprint"));
  if(i.oa) meta.append(el("span","badge oa","Acceso abierto"));
  const abs = el("p","abstract", i.abs);
  ct.append(meta, el("h2",null,i.title), el("p","authors",i.authors), abs, el("p","journal",i.journal));
  const rail = el("div","rail");
  const bSave = el("button","act"+(isSaved(i.id)?" on":"")); bSave.innerHTML=`<span class="ic">${isSaved(i.id)?ICON.saved:ICON.save}</span>Guardar`;
  bSave.onclick=()=>{ if(isSaved(i.id)){ saved=saved.filter(x=>x.id!==i.id); toast("Quitado de guardados") } else { saved.unshift(i); toast("Guardado") }
    persist(); const on=isSaved(i.id); bSave.classList.toggle("on",on); bSave.querySelector(".ic").innerHTML=on?ICON.saved:ICON.save; };
  const bMore = el("button","act"); bMore.innerHTML=`<span class="ic">${ICON.more}</span>Leer más`;
  bMore.onclick=()=>{ abs.classList.toggle("open"); abs.scrollTop=0; };
  const h2 = ct.querySelector("h2");
  const bEs = el("button","act"); bEs.innerHTML=`<span class="ic">${ICON.lang}</span>Español`;
  let es = null, showingEs = false;
  bEs.onclick=async()=>{
    if(showingEs){ h2.textContent=i.title; abs.textContent=i.abs; showingEs=false; bEs.classList.remove("on"); bEs.lastChild.textContent="Español"; return }
    if(!es){
      const prev = abs.textContent; abs.textContent = "Traduciendo…";
      try{ es = {title: await translate(i.title), abs: await translate(i.abs)} }
      catch(err){
        // Navegador sin traductor integrado: abrimos Google Traductor con el texto ya pegado
        abs.textContent = prev;
        toast("Tu navegador no traduce por sí solo; abriendo Google Traductor");
        window.open("https://translate.google.com/?sl=en&tl=es&op=translate&text="+encodeURIComponent(i.title+"\n\n"+i.abs.slice(0,4500)),"_blank","noopener");
        return }
    }
    h2.textContent=es.title; abs.textContent=es.abs; abs.scrollTop=0; showingEs=true; bEs.classList.add("on"); bEs.lastChild.textContent="Original";
  };
  const bShare = el("button","act"); bShare.innerHTML=`<span class="ic">${ICON.share}</span>Copiar`;
  bShare.onclick=async()=>{ try{ await navigator.clipboard.writeText(`${i.title}\n${i.url}`); toast("Enlace copiado") }catch(e){ toast(i.url) } };
  const aOpen = el("a","act primary"); aOpen.href=i.url; aOpen.target="_blank"; aOpen.rel="noopener"; aOpen.innerHTML=`<span class="ic">${ICON.open}</span>Artículo`;
  rail.append(bEs,bSave,bMore,bShare,aOpen);
  c.append(ct, rail);
  return s;
}
function loaderEl(){
  let l = feed.querySelector(".loader");
  if(!l){ l=el("section","slide loader"); l.innerHTML='<div class="state"><div><div class="spin"></div>Buscando ciencia nueva…<p class="msg" style="font-family:var(--f-mono);font-size:.75rem"></p></div></div>'; feed.append(l); io.observe(l); }
  return l;
}
function showLoader(on){ if(!done) loaderEl().hidden = false }
function showState(title, msg, retry){
  feed.innerHTML = "";
  const s = el("section","slide"); const st = el("div","state"); const box = el("div");
  box.append(el("h3",null,title), el("p",null,msg));
  if(retry){ const b=el("button",null,"Reintentar"); b.onclick=()=>reset(); box.append(b) }
  st.append(box); s.append(st); feed.append(s);
}
let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1800) }

// Scroll infinito: cuando el cargador se acerca a la vista, pide más
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) fetchMore() }), {root:feed, rootMargin:"0px 0px 150% 0px"});

function reset(){ cursor="*"; done=false; seen.clear(); feed.innerHTML=""; feed.scrollTop=0; loaderEl(); fetchMore() }

// ---------- Temas y vistas ----------
const chips = document.getElementById("chips");
TOPICS.forEach(t=>{
  const b = el("button","chip"); b.style.setProperty("--c",t.c); b.setAttribute("aria-pressed", t===topic);
  b.append(el("i"), document.createTextNode(t.name));
  b.onclick=()=>{ topic=t; chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b)); setView("feed", true) };
  chips.append(b);
});
function setView(v, force){
  if(v===view && !force) return; view=v;
  document.getElementById("v-feed").setAttribute("aria-pressed", v==="feed");
  document.getElementById("v-saved").setAttribute("aria-pressed", v==="saved");
  chips.hidden = v==="saved";
  if(v==="saved"){
    feed.innerHTML=""; feed.scrollTop=0;
    if(!saved.length) showState("Aún no has guardado nada","Pulsa Guardar en cualquier artículo y aparecerá aquí.");
    else saved.forEach(i=>feed.append(card(i)));
  } else reset();
}
document.getElementById("v-feed").onclick=()=>setView("feed");
document.getElementById("v-saved").onclick=()=>setView("saved");

// Teclado: flechas arriba/abajo para pasar artículos en el ordenador
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); feed.scrollBy({top:(e.key==="ArrowDown"?1:-1)*feed.clientHeight, behavior:"smooth"}) }
});

reset();
</script>
</body>
</html>
